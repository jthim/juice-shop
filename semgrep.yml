# Semgrep configuration file
rules:
    - id: detect-sensitive-console-logging
      message: "Potential data leak: Avoid logging sensitive object properties like password, token, or secret."
      severity: WARNING
      languages:
          - javascript
          - typescript
      patterns:
          - pattern: console.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(log|info|warn|error)$
          - pattern-either:
              # Matches console.log(user.password), req.body.token, etc. able to look at deeply nested properties
              - pattern: console.$METHOD(<... $OBJ.password ...>)
              - pattern: console.$METHOD(<... $OBJ.token ...>)
              - pattern: console.$METHOD(<... $OBJ.secret ...>)


    - id: package-dependencies-check
      patterns:
      - pattern-not-regex: \"[\w\-.]*\"\s*:\s*\"[\d.]+-[\w.]+\"
      - pattern-either:
          - pattern-regex: \"[\w\-.]*\"\s*:\s*\"latest\"
          - pattern-regex: \"[\w\-.]*\"\s*:\s*\"[^~\-\^><=\"x]*[~\-\^><=x]+.*\"
      - pattern-either:
          - pattern-inside: |
              "dependencies": {
                ...
              }
          - pattern-inside: |
              "devDependencies": {
                ...
              }
          - pattern-inside: |
              "optionalDependencies": {
                ...
              }
          - pattern-inside: |
              "peerDependencies": {
                ...
              }
      - pattern-not-inside: |
          "_shrinkwrap": {
            ...
          }
      paths:
      include:
        - "*package.json"
      message: "Package dependencies with variant versions may lead to dependency
        hijack and confusion attacks. Better to specify an exact version or use
        package-lock.json for a specific version of the package."
      languages:
      - json
      metadata:
      category: security
      vulnerability: Security Misconfiguration
      owasp: A05:2021 - Security Misconfiguration
      cwe:
        - "CWE-427: Uncontrolled Search Path Element"
      references:
        - https://security.snyk.io/vuln/SNYK-JS-COLORS-2331906
        - https://medium.com/@alex.birsan/dependency-confusion-4a5d60fec610
        - https://cwe.mitre.org/data/definitions/427.html
      technology:
        - npm
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      severity: WARNING

