# Name of this GitHub Actions workflow.
name: Semgrep

on:
    # Scan changed files in PRs (diff-aware scanning):
    pull_request: {}
    # Scan on-demand through GitHub Actions interface:
    workflow_dispatch: {}
    # Scan mainline branches if there are changes to .github/workflows/semgrep.yml:
    push:
        branches:
            - master

permissions:
    contents: read

jobs:
    semgrep:
        # User definable name of this GitHub Actions job.
        name: semgrep/ci
        # If you are self-hosting, change the following `runs-on` value:
        runs-on: ubuntu-latest

        container:
            # A Docker image with Semgrep installed. Do not change this.
            image: semgrep/semgrep

        steps:
            # Fetch project source with GitHub Actions Checkout.
            - uses: actions/checkout@v6

            # Run local rules exclusively
            - name: Run Semgrep Scan (Local Rules Only)
              run: |
                  set -e
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    echo "Running strict PR scan using local rules..."
                    semgrep scan --config=semgrep.yml --error
                  else
                    echo "Running non-blocking branch scan using local rules..."
                    semgrep scan --config=semgrep.yml || true
                  fi
